<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="成型產線">
<title>成型生產課產線管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --bg:#EEF1F8; --ink:#1C1C1E; --muted:#6C6C72; --line:rgba(60,60,67,.14);
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.78); --glass-brd:rgba(255,255,255,.75);
  --field:rgba(255,255,255,.72); --shadow:0 10px 30px rgba(40,50,90,.12);
  --blue:#007AFF; --purple:#AF52DE; --orange:#FF9500; --green:#34C759; --red:#FF3B30; --pink:#FF2D55; --teal:#30B0C7; --indigo:#5856D6; --yellow:#FFCC00;
  --blob1:#7FB2FF; --blob2:#E3A6FF; --blob3:#FFC58A; --blob4:#8EE6C4;
  --acc:var(--blue);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#06070C; --ink:#F2F2F7; --muted:#A1A1AA; --line:rgba(235,235,245,.12);
    --glass:rgba(30,32,44,.55); --glass-strong:rgba(36,38,52,.82); --glass-brd:rgba(255,255,255,.09);
    --field:rgba(255,255,255,.07); --shadow:0 12px 34px rgba(0,0,0,.45);
    --blue:#0A84FF; --purple:#BF5AF2; --orange:#FF9F0A; --green:#30D158; --red:#FF453A; --pink:#FF375F; --teal:#40C8E0; --indigo:#5E5CE6; --yellow:#FFD60A;
    --blob1:#1D4FBF; --blob2:#6A1F9A; --blob3:#8A3B12; --blob4:#0E6B52;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#06070C; --ink:#F2F2F7; --muted:#A1A1AA; --line:rgba(235,235,245,.12);
  --glass:rgba(30,32,44,.55); --glass-strong:rgba(36,38,52,.82); --glass-brd:rgba(255,255,255,.09);
  --field:rgba(255,255,255,.07); --shadow:0 12px 34px rgba(0,0,0,.45);
  --blue:#0A84FF; --purple:#BF5AF2; --orange:#FF9F0A; --green:#30D158; --red:#FF453A; --pink:#FF375F; --teal:#40C8E0; --indigo:#5E5CE6; --yellow:#FFD60A;
  --blob1:#1D4FBF; --blob2:#6A1F9A; --blob3:#8A3B12; --blob4:#0E6B52;
  color-scheme:dark;
}
body[data-view="records"]{--acc:var(--blue)}
body[data-view="roster"]{--acc:var(--purple)}
body[data-view="schedule"]{--acc:var(--orange)}
body[data-view="stock"]{--acc:var(--green)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--glass-strong);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx{background:linear-gradient(180deg,#C9DEFF 0%,#F9DCEA 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bgfx{background:linear-gradient(180deg,#0B1D44 0%,#2E0F3A 100%)}}
:root[data-theme="dark"] .bgfx{background:linear-gradient(180deg,#0B1D44 0%,#2E0F3A 100%)}
.bgfx i{display:none}
.bgfx i:nth-child(1){width:55vmax;height:55vmax;left:-15vmax;top:-18vmax;background:var(--blob1)}
.bgfx i:nth-child(2){width:45vmax;height:45vmax;right:-14vmax;top:8vmax;background:var(--blob2)}
.bgfx i:nth-child(3){width:40vmax;height:40vmax;left:20vmax;bottom:-20vmax;background:var(--blob3)}
.bgfx i:nth-child(4){width:30vmax;height:30vmax;right:6vmax;bottom:-6vmax;background:var(--blob4)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 60%,transparent);outline-offset:2px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--glass-brd);box-shadow:var(--shadow)}

/* ===== header ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:10px 14px 12px;border-radius:0 0 24px 24px;border-top:0}
.top-row{display:flex;align-items:center;gap:10px;max-width:1440px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.01em;white-space:nowrap}
.logo .mark{display:none}
.tools .mark{height:28px;padding:3px 6px;border-radius:8px;background:#fff;display:grid;place-items:center;box-shadow:0 1px 4px rgba(190,15,40,.15);border:1px solid rgba(190,15,40,.12);flex-shrink:0;box-sizing:border-box;margin-left:2px}
.tools .mark img{height:100%;width:auto;display:block}
.logo .mark-img{height:34px;width:auto;display:block;flex:none}
.logo small{display:block;font-size:12px;color:var(--muted);font-weight:500;line-height:1.2}
.seg{display:none;margin:0 auto;padding:4px;border-radius:14px;background:var(--field);border:1px solid var(--line);gap:2px}
.seg a{padding:8px 18px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.seg a .dot{width:9px;height:9px;border-radius:50%}
.seg a[aria-current="page"]{background:var(--glass-strong);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:20px;background:var(--field);border:1px solid var(--line);white-space:nowrap}
.pill .led{width:8px;height:8px;border-radius:50%;background:var(--orange)}
.pill.cloud .led{background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 25%,transparent)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--field);display:grid;place-items:center;font-size:18px}
.searchbar{max-width:1440px;margin:10px auto 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 260px;position:relative;min-width:0}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--field);padding:0 38px 0 38px;font-size:16px}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:18px}
#filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--field);padding:0 12px;font-size:16px;min-width:0}
.btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--field);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:transparent;color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--acc) 35%,transparent)}
.btn.danger{color:var(--red)}
.btn.danger.armed{background:var(--red);color:#fff;border-color:transparent}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:active,.chip:active,.cell:active{transform:scale(.97)}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--field);font-weight:600;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:transparent}

/* ===== layout ===== */
.wrap{max-width:1440px;margin:0 auto;padding:16px 14px 110px;display:grid;gap:16px}
.view-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.view-title h1{margin:0;font-size:28px;font-weight:700;letter-spacing:.01em}
.view-title .meta{color:var(--muted);font-size:15px}
.view-title .meta b{color:var(--acc)}
.layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.panel{border-radius:22px;padding:16px}
.panel h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.panel h2 .bar{width:4px;height:18px;border-radius:2px;background:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{border-radius:18px;padding:12px 14px;position:relative;overflow:hidden}
.stat span{font-size:13px;color:var(--muted);font-weight:500}
.stat b{display:block;font-size:28px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat::after{content:"";position:absolute;right:-18px;top:-18px;width:62px;height:62px;border-radius:50%;background:var(--c,var(--acc));opacity:.22}
.stat.c-blue{--c:var(--blue)} .stat.c-green{--c:var(--green)} .stat.c-red{--c:var(--red)} .stat.c-orange{--c:var(--orange)} .stat.c-purple{--c:var(--purple)} .stat.c-teal{--c:var(--teal)} .stat.c-pink{--c:var(--pink)} .stat.c-indigo{--c:var(--indigo)}
.stat.alert b{color:var(--red)}
/* formula table */
.ftable{width:100%;border-collapse:collapse;font-size:14px}
.ftable th,.ftable td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.ftable th{font-size:12px;color:var(--muted);font-weight:600}
.ftable td:first-child{font-weight:600;white-space:nowrap}
.ftable code{font-family:var(--font);font-size:13px;background:var(--field);border:1px solid var(--line);padding:1px 7px;border-radius:7px;display:inline-block;line-height:1.6}
.ftable td.v{text-align:right;font-weight:700;color:var(--acc);white-space:nowrap;font-variant-numeric:tabular-nums}
/* list cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{border-radius:18px;padding:14px 16px;width:100%;text-align:left;display:grid;gap:4px 14px;grid-template-columns:auto 1fr auto;align-items:center}
.card .badge{min-width:56px;height:56px;padding:0 8px;border-radius:16px;display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff;background:linear-gradient(140deg,var(--acc),color-mix(in srgb,var(--acc) 55%,var(--purple)))}
.card .t{font-weight:700;font-size:17px;line-height:1.3}
.card .s{font-size:13px;color:var(--muted);line-height:1.45}
.card .r{text-align:right;font-variant-numeric:tabular-nums}
.card .r b{font-size:20px;display:block;line-height:1.2}
.card .r small{font-size:12px;color:var(--muted)}
.card .r .ng{color:var(--red)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:9px;background:var(--field);border:1px solid var(--line)}
.tag.ok{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green);border-color:transparent}
.tag.warn{background:color-mix(in srgb,var(--orange) 20%,transparent);color:var(--orange);border-color:transparent}
.tag.bad{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red);border-color:transparent}
.tag.blue{background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue);border-color:transparent}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.progress i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--orange),var(--pink))}
.progress.done i{background:var(--green)}
.empty{border-radius:22px;padding:36px 20px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:14px}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
/* simple tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:18px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:15px}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl thead th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0}
.tbl td.n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.tbl tr.low td.n{color:var(--red)}
.tbl .nm{background:none;border:0;padding:0;font-weight:700;text-align:left}
.tbl .sticky{position:sticky;left:0;background:var(--glass-strong);z-index:1}
/* roster */
.roster th,.roster td{text-align:center;padding:6px 4px}
.roster th.sticky,.roster td.sticky{text-align:left;padding-left:12px}
.roster thead th b{display:block;font-size:16px;color:var(--ink)}
.roster thead th.today b{color:var(--acc)}
.roster th small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.cell{width:100%;min-width:46px;height:46px;border-radius:12px;border:1.5px dashed var(--line);background:transparent;font-weight:700;font-size:16px;color:var(--muted)}
.cell[data-v="早"]{background:linear-gradient(140deg,#FFD60A,#FF9F0A);color:#3A2600;border:0}
.cell[data-v="中"]{background:linear-gradient(140deg,#64D2FF,#0A84FF);color:#fff;border:0}
.cell[data-v="夜"]{background:linear-gradient(140deg,#7D7AFF,#5E2CA5);color:#fff;border:0}
.cell[data-v="日12"]{background:linear-gradient(140deg,#5EE6A8,#18A558);color:#fff;border:0;font-size:14px}
.cell[data-v="夜12"]{background:linear-gradient(140deg,#FF6FA0,#B0245E);color:#fff;border:0;font-size:14px}
.cell[data-v="休"]{background:var(--field);border:1px solid var(--line);color:var(--muted)}
.cell[data-v="特休"]{background:color-mix(in srgb,var(--teal) 24%,transparent);color:var(--teal);border:0;font-size:14px}
.cell[data-v="病假"]{background:color-mix(in srgb,var(--red) 20%,transparent);color:var(--red);border:0;font-size:14px}
.cell[data-v="事假"]{background:color-mix(in srgb,var(--orange) 22%,transparent);color:var(--orange);border:0;font-size:14px}
.cell[data-v="公假"]{background:color-mix(in srgb,var(--indigo) 22%,transparent);color:var(--indigo);border:0;font-size:14px}
.pick-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.pick-head b{font-size:18px}
.pick-group{margin:0 0 12px;padding:12px 14px;border-radius:18px;background:var(--field);border:1px solid var(--line)}
.pick-group h4{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.pick-group h4 .tag{font-weight:600}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pick-grid .cell{height:60px;font-size:18px;line-height:1.15}
.pick-grid .cell small{display:block;font-size:11px;font-weight:500;opacity:.9}
.pick-grid .cell.cur{outline:3px solid var(--acc);outline-offset:2px}
.pick-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.pick-foot label{display:flex;align-items:center;gap:8px;font-size:15px;flex:1}
.pick-foot input{width:20px;height:20px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
/* gantt */
.gantt{display:grid;min-width:760px;font-size:12px}
.gantt .gh{text-align:center;color:var(--muted);padding:4px 0 8px;line-height:1.2}
.gantt .gh b{display:block;font-size:14px;color:var(--ink)}
.gantt .gh.today b{color:#fff;background:var(--acc);border-radius:8px;margin:0 4px}
.gantt .lane{font-weight:700;font-size:15px;padding:8px 10px;display:flex;align-items:center;border-top:1px solid var(--line);position:sticky;left:0;background:var(--glass-strong);z-index:1}
.gantt .track{border-top:1px solid var(--line);position:relative;display:grid;padding:6px 0;gap:4px;align-items:center}
.gantt .tline{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--acc) 14%,transparent)}
.gbar{position:relative;min-height:38px;border-radius:10px;padding:3px 8px;font-size:12px;line-height:1.25;text-align:left;border:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#fff;background:linear-gradient(135deg,var(--orange),var(--pink));font-weight:700}
.gbar small{display:block;font-weight:500;opacity:.9}
.gbar.st-待排{background:var(--field);color:var(--ink);border:1px dashed var(--muted)}
.gbar.st-排定{background:linear-gradient(135deg,var(--teal),var(--blue))}
.gbar.st-暫停{background:linear-gradient(135deg,#C7C7CC,#8E8E93)}
.gbar.st-完成{background:linear-gradient(135deg,var(--green),#1E9E5A)}
.gbar.late{box-shadow:inset 0 0 0 3px var(--red)}
/* bottom tab (mobile) */
.tabbar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:45;border-radius:24px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;pointer-events:auto;touch-action:manipulation}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:18px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600}
.tabbar a svg{width:24px;height:24px}
.tabbar a[aria-current="page"]{color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
/* sheet */
dialog{border:0;padding:0;color:var(--ink);background:transparent;width:100%;max-width:100%;max-height:100%;margin:auto 0 0;}
dialog::backdrop{background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet{display:flex;flex-direction:column;max-height:92vh;border-radius:26px 26px 0 0;background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glass-brd);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.sheet header{display:flex;align-items:center;gap:10px;padding:10px 18px 12px}
.sheet header h3{margin:0;font-size:20px;flex:1}
.sheet .body{overflow:auto;padding:0 18px 16px}
.sheet footer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.sheet footer .sp{flex:1}
fieldset{border:0;padding:14px;margin:0 0 12px;border-radius:18px;background:var(--field);border:1px solid var(--line)}
legend{float:left;width:100%;font-weight:700;font-size:15px;padding:0;margin-bottom:10px;display:flex;align-items:center;gap:8px}
legend::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc)}
legend+*{clear:both}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.f .ctl{width:100%;color:var(--ink);font-size:17px;height:46px;background:var(--glass-strong)}
.f textarea.ctl{height:auto;min-height:80px;padding:10px 12px}
.f.wide{grid-column:1/-1}
.uw{position:relative}
.uw .ctl{padding-right:46px;font-weight:600;font-variant-numeric:tabular-nums}
.uw em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:13px;pointer-events:none}
.qf{display:flex;gap:4px;flex-wrap:wrap;min-height:0}
.qf button{border:0;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);font-size:12px;font-weight:600;padding:3px 9px;border-radius:9px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calc{border-radius:18px;padding:12px 14px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 16%,transparent),color-mix(in srgb,var(--purple) 12%,transparent));border:1px solid var(--line)}
.calc h4{margin:0 0 6px;font-size:14px}
.calc .ftable td.v{font-size:16px}
.draft{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--yellow) 22%,transparent);margin-bottom:12px}
.draft button{margin-left:auto}
.staffrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.staffrow div{flex:1}
.staffrow small{color:var(--muted);margin-left:6px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);padding:12px 18px;border-radius:16px;font-weight:600;font-size:15px;z-index:60;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav b{min-width:120px;text-align:center;font-size:15px}
.hide-m{display:none}

/* ===== PC：橫式版面 ===== */
@media (min-width:900px){
  body{font-size:17px}
  .top{padding:12px 24px 14px;margin:0 16px;border-radius:0 0 26px 26px}
  .seg{display:flex}
  .tabbar{display:none}
  .wrap{padding:22px 24px 40px}
  .layout{grid-template-columns:minmax(0,1fr) 360px;align-items:start}
  .layout aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 140px);display:grid;gap:16px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  dialog{width:min(920px,94vw);margin:auto}
  .sheet{border-radius:26px;max-height:88vh}
  .sheet .grab{display:none}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .toast{bottom:32px}
  .hide-m{display:revert}
  .card{grid-template-columns:auto 1.4fr 1fr auto}
}
@media (min-width:1280px){ .layout{grid-template-columns:minmax(0,1fr) 400px} }
/* 隱藏計算公式：右側公式面板不顯示，表單「即時計算」只留結果 */
aside .panel:has(.ftable){display:none}
.ftable th:nth-child(2),.ftable td:nth-child(2){display:none}

/* ===== 甘特圖 ===== */
.gx-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.gx-tools h2{margin:0;flex:1}
.gx-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:16px}
.gx{min-width:var(--w);position:relative}
.gx-row{display:grid;grid-template-columns:96px 1fr}
.gx-name{position:sticky;left:0;z-index:3;background:var(--glass-strong);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);padding:8px 10px;font-weight:700;font-size:15px;display:flex;flex-direction:column;justify-content:center;border-top:1px solid var(--line)}
.gx-name small{font-size:11px;color:var(--muted);font-weight:500}
.gx-head .gx-name{border-top:0;font-size:12px;color:var(--muted)}
.gx-days{display:grid;grid-template-columns:repeat(var(--n),1fr)}
.gx-days div{text-align:center;font-size:11px;color:var(--muted);padding:4px 0 6px;line-height:1.2;border-left:1px solid var(--line)}
.gx-days div b{display:block;font-size:14px;color:var(--ink)}
.gx-days div.we{background:color-mix(in srgb,var(--muted) 9%,transparent)}
.gx-days div.td b{color:#fff;background:var(--acc);border-radius:7px;margin:0 3px}
.gx-days div.m1 b{color:var(--acc)}
.gx-track{position:relative;border-top:1px solid var(--line);background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100% / var(--n)) 100%}
.gx-we{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--muted) 9%,transparent)}
.gx-now{position:absolute;top:0;bottom:0;width:2px;background:var(--pink);z-index:2;box-shadow:0 0 8px var(--pink)}
.gx-head .gx-now::before{content:"現在";position:absolute;top:-2px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:#fff;background:var(--pink);padding:0 5px;border-radius:6px;white-space:nowrap}
.gx-plan{position:absolute;height:4px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--muted) 0 6px,transparent 6px 10px);opacity:.7}
.gx-bar{position:absolute;height:38px;border-radius:11px;border:0;padding:0;overflow:hidden;color:#fff;text-align:left;box-shadow:0 4px 12px rgba(0,0,0,.15);min-width:8px;z-index:1}
.gx-bar .fill{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.28)}
.gx-bar .lb{position:relative;display:block;padding:3px 9px;font-size:12px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gx-bar .lb small{display:block;font-weight:500;opacity:.92;font-size:11px}
.gx-bar.s-run{background:linear-gradient(135deg,#FF9F0A,#FF375F)}
.gx-bar.s-plan{background:linear-gradient(135deg,#40C8E0,#0A84FF)}
.gx-bar.s-wait{background:linear-gradient(135deg,#A1A1AA,#6E6E78)}
.gx-bar.s-pause{background:repeating-linear-gradient(135deg,#8E8E93 0 8px,#AEAEB2 8px 16px)}
.gx-bar.s-done{background:linear-gradient(135deg,#30D158,#1E9E5A)}
.gx-bar.s-late{box-shadow:0 0 0 3px var(--red),0 4px 12px rgba(255,59,48,.35)}
.gx-due{position:absolute;width:0;border-left:2px dashed var(--red);z-index:2}
.gx-due span{position:absolute;top:-1px;left:3px;font-size:10px;font-weight:700;color:#fff;background:var(--red);padding:0 4px;border-radius:5px;white-space:nowrap}
.gx-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.gx-legend i{display:inline-block;width:22px;height:10px;border-radius:4px;vertical-align:-1px;margin-right:5px}

/* ===== 生產表單 ===== */
.spec{font-size:11px;color:var(--muted);font-weight:500}
.uw.oos .ctl{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--glass-strong));color:var(--red)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:8px}
.et{border-collapse:collapse;min-width:100%}
.et th{font-size:12px;color:var(--muted);font-weight:600;padding:4px;text-align:left;white-space:nowrap}
.et th small{display:block;font-weight:500;font-size:10px;opacity:.85}
.et td{padding:3px}
.et .ctl{height:42px;font-size:15px;min-width:78px;width:100%;padding:0 8px;background:var(--glass-strong)}
.et input[type=time].ctl{min-width:100px}
.et td.fx{font-weight:700;white-space:nowrap;padding-right:10px;color:var(--ink);font-size:14px}
.et td.fx small{display:block;font-weight:500;font-size:10px;color:var(--muted)}
.okng[data-v="OK"]{color:var(--green);font-weight:700}
.okng[data-v="NG"]{color:#fff;background:var(--red);font-weight:700}
.rowdel{width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-size:16px}
.ct{width:100%;border-collapse:collapse;font-size:14px}
.ct th,.ct td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.ct thead th{text-align:center;font-size:12px;color:var(--muted)}
.ct thead th:first-child,.ct thead th:nth-child(2){text-align:left}
.ct td.v{text-align:center;font-weight:700;font-variant-numeric:tabular-nums;min-width:64px}
.ct td.v.bad{color:#fff;background:var(--red);border-radius:8px}
.ct .sp{color:var(--muted);font-size:12px;font-weight:500}
.ct tr.gh td{font-weight:700;color:var(--acc);background:color-mix(in srgb,var(--acc) 9%,transparent);font-size:13px}
.shbtn{border:0;background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc);font-weight:700;border-radius:10px;padding:6px 10px;min-width:74px;font-size:14px}
.shbtn small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.shbtn.add{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.badge2{min-width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(140deg,var(--acc),color-mix(in srgb,var(--acc) 55%,var(--purple)))}
/* 下拉選單：選項清單用不透明底色，深淺色模式都看得清楚 */
select.ctl{color:var(--ink);font-weight:600;background-color:var(--glass-strong)}
select option,select optgroup{background-color:#FFFFFF;color:#1C1C1E;font-weight:500}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) select option,:root:not([data-theme="light"]) select optgroup{background-color:#232634;color:#F2F2F7}}
:root[data-theme="dark"] select option,:root[data-theme="dark"] select optgroup{background-color:#232634;color:#F2F2F7}
.io-sec{margin-bottom:14px}
.io-sec h4{margin:0 0 8px;font-size:15px}
.io-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.io-btn{text-align:left;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--field);min-height:64px}
.io-btn b{display:block;font-size:15px}
.io-btn small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.io-btn:active{transform:scale(.98)}
/* scanner */
.scanbtn{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:10px;border:0;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);display:grid;place-items:center}
.scanbtn svg,.iconbtn svg{width:20px;height:20px}
.sw{position:relative}
.sw .ctl{padding-right:48px}
#scanner{width:100%;height:100%;height:100dvh;max-width:100%;max-height:100%;max-height:100dvh;margin:0;background:#000;color:#fff}
.scan-close{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:3;height:44px;padding:0 16px 0 12px;border-radius:22px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;font-size:16px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.scan-close svg{width:20px;height:20px}
.scan-top{padding-right:120px!important;padding-left:120px!important}
@media (max-width:520px){.scan-top{padding-left:16px!important;text-align:left!important}}
.scan-bottom #sccancel{background:rgba(255,69,58,.85)!important;border-color:transparent!important}
#scanner::backdrop{background:#000}
.scan-wrap{position:relative;height:100%;display:flex;flex-direction:column}
.scan-wrap video{flex:1;width:100%;min-height:0;object-fit:cover;background:#000}
.scan-frame{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:min(78vw,460px);height:min(42vw,220px);border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);border:3px solid rgba(255,255,255,.9);pointer-events:none}
.scan-frame::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:#FF375F;box-shadow:0 0 12px #FF375F}
.scan-top{position:absolute;top:0;left:0;right:0;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;text-align:center;background:linear-gradient(180deg,rgba(0,0,0,.65),transparent)}
.scan-top h3{margin:0;font-size:19px}
.scan-top p{margin:4px 0 0;font-size:14px;opacity:.85}
.scan-bottom{padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(20,20,24,.92);display:grid;gap:10px}
.scan-bottom .row2{display:flex;gap:8px}
.scan-bottom input{flex:1;height:46px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;padding:0 12px;font-size:17px}
.scan-bottom .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2);color:#fff}
.scan-bottom .btn.pri{background:#0A84FF;border-color:transparent}
.scan-bottom label.btn{cursor:pointer}
.scan-bottom input[type=file]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const SCAN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 9v6M11 9v6M14 9v6M17 9v6"/></svg>';

/* ---------- 聲音回饋（Web Audio 即時合成，不需音檔） ---------- */
var actx = null, soundOn = mem.get('sound', true);
function sfx(kind) {
  if (!kind || !soundOn) return;

    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; actx = new AC(); }
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime;
    const tone = (f, st, dur, type, vol) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0 + st);
      g.gain.setValueAtTime(0.0001, t0 + st); g.gain.exponentialRampToValueAtTime(vol, t0 + st + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t0 + st + dur);
      o.connect(g); g.connect(actx.destination); o.start(t0 + st); o.stop(t0 + st + dur + 0.03); };
    if (kind === 'tap') tone(1500, 0, 0.045, 'sine', 0.09);            // 輕點：短促「滴」
    else if (kind === 'cell') tone(1100, 0, 0.06, 'sine', 0.1);       // 排班格子
    else if (kind === 'ok') { tone(880, 0, 0.12, 'sine', 0.13); tone(1320, 0.09, 0.2, 'sine', 0.13); }   // 成功：上揚雙音
    else if (kind === 'err') { tone(330, 0, 0.13, 'triangle', 0.16); tone(220, 0.12, 0.2, 'triangle', 0.16); } // 錯誤：下降雙音
  } catch (e) {}
}

/* ---------- 全螢幕：按一次後會記住，下次開啟點畫面任一處就自動進入全螢幕 ---------- */
const FS_IN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="20" height="20"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const FS_OUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="20" height="20"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;

function fsExit() { const f = document.exitFullscreen || document.webkitExitFullscreen; if (f) try { f.call(document); } catch (e) {} }

paintFS();

$('#fs').onclick = () => {

};

}

/* ---------- 資料層：雲端同步（多台裝置共用），無法連線時改用本機 ---------- */
const COLLS = { logs:{order:'ts',limit:800}, staff:{}, roster:{}, orders:{}, items:{}, moves:{order:'ts',limit:400}, config:{}, forming:{order:'ts',limit:600}, trimming:{order:'ts',limit:600}, sheets:{order:'ts',limit:800}, reports:{order:'ts',limit:400} };
const S = { mode:'local', db:null, data:{} };
for (const c in COLLS) S.data[c] = new Map();
function loadLocal() { for (const c in COLLS) { try { const raw = localStorage.getItem('mfg_' + c); if (raw) S.data[c] = new Map(Object.entries(JSON.parse(raw))); } catch (e) {} } }
function persistLocal(c) { try { localStorage.setItem('mfg_' + c, JSON.stringify(Object.fromEntries(S.data[c]))); } catch (e) {} }
function setSync() { const el = $('#sync'); el.className = 'pill ' + S.mode; el.lastElementChild.textContent = S.mode === 'cloud' ? '雲端同步' : '本機模式'; el.title = S.mode === 'cloud' ? '資料即時同步到所有裝置' : '資料只存在這台裝置'; }
async function connect() {
  let db = null;
  try { if (window.claude && window.claude.use) db = await window.claude.use('db'); } catch (e) {}
  if (!db) { S.mode = 'local'; setSync(); return; }
  S.db = db; S.mode = 'cloud';
  for (const c in COLLS) S.data[c] = new Map();
  setSync(); render();
  for (const c in COLLS) {
    let q = db.collection(c); const o = COLLS[c];
    if (o.order) q = q.orderBy(o.order, 'desc').limit(o.limit);
    q.onSnapshot(snap => { S.data[c] = new Map(snap.docs.map(d => [d.id, d.data()])); scheduleRender(); },
                 err => toast('同步中斷，請重新整理頁面（' + (err && err.code || '') + '）'));
  }
}
async function save(c, id, obj) {
  const body = JSON.parse(JSON.stringify(obj));
  if (S.mode === 'cloud') {
    try { await S.db.collection(c).doc(id).set(body); }
    catch (e) { toast(e && e.code === 'permission_denied' ? '你的權限只能檢視，無法儲存' : '儲存失敗，請再試一次'); throw e; }
  } else { S.data[c].set(id, body); persistLocal(c); scheduleRender(); }
}
async function removeDoc(c, id) {
  if (S.mode === 'cloud') { try { await S.db.collection(c).doc(id).delete(); } catch (e) { toast('刪除失敗，請再試一次'); throw e; } }
  else { S.data[c].delete(id); persistLocal(c); scheduleRender(); }
}
const list = c => [...S.data[c]].map(([id, v]) => ({ id, ...v }));

/* ---------- 建議清單 & 最近輸入 ---------- */
function uniq(arr) { return [...new Set(arr.filter(v => has(v) && String(v).trim() !== '').map(String))].sort((a, b) => a.localeCompare(b, 'zh-Hant')); }
function suggestions() {
  const logs = list('logs'), orders = list('orders'), items = list('items');
  const fm = list('forming'), tr = list('trimming'), sh = list('sheets'), rp = list('reports');
  return {
    machine: uniq(['ASANO_FLC','ASANO_PLP & PLS','AS-1','SS-1', ...logs.map(x => x.machine), ...orders.map(x => x.machine), ...fm.map(x => x.machine), ...tr.map(x => x.machine)]),
    mold: uniq([...logs.map(x => x.mold), ...orders.map(x => x.mold), ...fm.map(x => x.mold), ...tr.flatMap(x => [x.plpMold, x.plsMold])]),
    part: uniq([...logs.map(x => x.part), ...orders.map(x => x.part), ...fm.map(x => x.part), ...tr.map(x => x.part), ...sh.map(x => x.part), ...rp.flatMap(x => (x.outT || []).map(r => r.part))]),
    fileName: uniq([...fm.map(x => x.fileName), ...tr.flatMap(x => [x.plpFile, x.plsFile])]),
    batch: uniq([...sh.map(x => x.batch), ...rp.flatMap(x => (x.sheetT || []).map(r => r.batch))]),

}
/* 最近輸入過的值（新到舊、不重複），做成「快速填入」小按鈕 */
function recentVals(coll, key, n) {
  const src = list(coll).sort((a, b) => (b.ts || b.updated || 0) - (a.ts || a.updated || 0));
  const out = [];
  for (const x of src) { const v = x[key]; if (has(v) && String(v).trim() !== '' && !out.includes(String(v))) { out.push(String(v)); if (out.length >= n) break; } }
  return out;
}

function scanWrap(key, inputHTML) { return SCAN_KEYS.has(key) ? `<span class="sw">${inputHTML}<button type="button" class="scanbtn" data-scan="${key}" aria-label="掃描條碼填入" title="掃描條碼">${SCAN_SVG}</button></span>` : inputHTML; }
function fieldHTML([key, label, type, extra], v, sug, quick) {
  const val = v[key] ?? '';
  const qf = quick && quick[key] && quick[key].length ? `<span class="qf">${quick[key].map(q => `<button type="button" data-fill="${key}" data-val="${esc(q)}" title="快速填入">${esc(q)}</button>`).join('')}</span>` : '';
  if (type === 'table') return `<div class="f wide">${label ? `<span>${label}</span>` : ''}${tblHTML(key, v[key], sug)}</div>`;
  if (type === 'spec') { const it = extra, neg = (it.max != null && it.max < 0) || (it.min != null && it.min < 0);
    return `<label class="f">${esc(it.l)}<span class="uw"><input class="ctl" name="${key}" type="text" ${neg ? '' : 'inputmode="decimal"'} autocomplete="off" value="${esc(val)}">${it.u ? `<em>${esc(it.u)}</em>` : ''}</span>${it.spec ? `<span class="spec" data-spec-of="${key}">規格 ${esc(specText(it, v.material))}</span>` : ''}${qf}</label>`; }

  if (type === 'select') { const opts = has(val) && !extra.includes(val) ? [...extra, val] : extra; return `<label class="f">${label}<select class="ctl" name="${key}">${opts.map(o => `<option${o === val ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`; }

function readForm(root, sections) {
  const out = {};
  for (const s of sections) for (const [key, , type] of s.fields) {
    if (type === 'table') { if (root.querySelector(`[data-table="${key}"]`)) out[key] = readTable(root, key); continue; }
    const el = root.querySelector(`[name="${key}"]`); if (!el) continue;
    const raw = el.value.trim();
    out[key] = (type === 'num' || type === 'spec') ? (raw === '' ? '' : num(raw)) : raw;
  }
  return out;
}
function fillForm(root, data) { for (const k in data) {
  if (Array.isArray(data[k])) { const tb = root.querySelector(`[data-table="${k}"] tbody`); if (tb && TBL[k]) tb.innerHTML = tblBody(k, data[k]); continue; }
  const el = root.querySelector(`[name="${k}"]`); if (el && has(data[k])) el.value = data[k]; } }

function openSheet({ title, body, onSave, onDelete, saveLabel = '儲存', extraBtn, draftKey, sections, onInput, onScan }) {
  dlg.innerHTML = `<form class="sheet" onsubmit="return false"><div class="grab"></div>
    <header><h3>${title}</h3>${extraBtn ? `<button type="button" class="btn sm" id="xbtn">${extraBtn.label}</button>` : ''}</header>
    <div class="body"><div id="draftbar"></div>${body}</div>
    <footer>${onDelete ? '<button type="button" class="btn danger" id="del">刪除</button>' : ''}<span class="sp"></span>
      <button type="button" class="btn" id="cancel">取消</button>${onSave ? `<button type="button" class="btn pri" id="ok">${saveLabel}</button>` : ''}</footer></form>`;
  const close = () => dlg.close();
  $('#cancel', dlg).onclick = close;
  // 草稿：新增時若上次沒存就關掉，會自動恢復
  if (draftKey && sections) {
    const dr = mem.get('draft_' + draftKey, null);
    if (dr) {
      fillForm(dlg, dr);
      $('#draftbar', dlg).innerHTML = `<div class="draft">已恢復上次未儲存的內容<button type="button" class="btn sm" id="dclr">清空重填</button></div>`;
      $('#dclr', dlg).onclick = () => { mem.del('draft_' + draftKey); dlg.close(); setTimeout(() => openSheet(arguments[0]), 0); };
    }
    dlg.oninput = () => { mem.set('draft_' + draftKey, readForm(dlg, sections)); onInput && onInput(dlg); };
  } else dlg.oninput = () => onInput && onInput(dlg);
  dlg.onclick = async e => {
    const sb = e.target.closest('[data-scan]');
    if (sb) { e.preventDefault(); const key = sb.dataset.scan; const v = await scanCode('掃描「' + (sb.closest('.f')?.firstChild?.textContent || '') + '」');
      if (v) { const el = $(`[name="${key}"]`, dlg); if (el) { el.value = v; el.dispatchEvent(new Event('input', { bubbles:true })); } onScan && onScan(key, v, dlg); } return; }
    const b = e.target.closest('[data-fill]'); if (!b) return; const el = $(`[name="${b.dataset.fill}"]`, dlg); if (el) { el.value = b.dataset.val; el.dispatchEvent(new Event('input', { bubbles:true })); } };
  if (onSave) $('#ok', dlg).onclick = async () => { try { const r = await onSave(dlg); if (r !== false) { if (draftKey) mem.del('draft_' + draftKey); close(); } } catch (e) {} };
  if (extraBtn) $('#xbtn', dlg).onclick = () => { extraBtn.onClick(dlg); dlg.dispatchEvent(new Event('input')); };
  if (onDelete) {
    const b = $('#del', dlg); let armed = false, t;
    b.onclick = async () => {
      if (!armed) { armed = true; b.classList.add('armed'); b.textContent = '再按一次刪除'; t = setTimeout(() => { armed = false; b.classList.remove('armed'); b.textContent = '刪除'; }, 3000); return; }
      clearTimeout(t); try { await onDelete(); close(); toast('已刪除'); } catch (e) {}
    };
  }
  dlg.showModal();
  onInput && onInput(dlg);
}

/* ---------- 相機掃描條碼（ZXing，支援一維條碼與 QR Code） ---------- */
let zxLoad = null;
function loadZX() {
  if (window.ZXing) return Promise.resolve();
  if (!zxLoad) zxLoad = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'; s.onload = res; s.onerror = () => { zxLoad = null; rej(new Error('load')); }; document.head.appendChild(s); });
  return zxLoad;
}
function scanCode(title = '掃描條碼') {
  return new Promise(resolve => {
    const sc = $('#scanner'); let reader = null, finished = false;
    sc.innerHTML = `<div class="scan-wrap"><video playsinline muted></video><div class="scan-frame"></div>
      <div class="scan-top"><h3>${esc(title)}</h3><p id="scmsg">正在開啟相機…</p></div>
      <button class="scan-close" id="scclose" aria-label="關閉掃描"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>關閉</button>
      <div class="scan-bottom"><div class="row2"><input id="scman" placeholder="或手動輸入條碼" autocomplete="off" enterkeyhint="done"><button class="btn pri" id="scok">確定</button></div>
      <div class="row2"><label class="btn" style="flex:1">拍照辨識<input type="file" accept="image/*" capture="environment" id="scfile"></label><button class="btn" id="sccancel" style="flex:1">取消</button></div></div></div>`;
    const msg = t => { const m = $('#scmsg', sc); if (m) m.textContent = t; };
    const finish = v => {
      if (finished) return; finished = true;
      try { reader && reader.reset(); } catch (e) {}
      const vd = $('video', sc); if (vd && vd.srcObject) { vd.srcObject.getTracks().forEach(t => t.stop()); vd.srcObject = null; }
      sc.close(); sc.innerHTML = '';
      if (v) { try { navigator.vibrate && navigator.vibrate(60); } catch (e) {} toast('已讀取：' + v); }
      resolve(v ? String(v).trim() : null);
    };
    $('#sccancel', sc).onclick = () => finish(null);
    $('#scclose', sc).onclick = () => finish(null);
    $('#scok', sc).onclick = () => { const v = $('#scman', sc).value.trim(); if (v) finish(v); else msg('請輸入條碼內容'); };
    $('#scman', sc).onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#scok', sc).click(); } };
    sc.oncancel = e => { e.preventDefault(); finish(null); };
    $('#scfile', sc).onchange = async e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      msg('辨識照片中…');
      try { await loadZX(); const r2 = new ZXing.BrowserMultiFormatReader(); const url = URL.createObjectURL(f);
        const res = await r2.decodeFromImageUrl(url); URL.revokeObjectURL(url); finish(res.getText()); }
      catch (err) { msg('照片裡找不到條碼，請靠近一點、對準條碼再拍一次。'); }
    };
    sc.showModal();
    (async () => {
      try {
        await loadZX();
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nomedia');
        reader = new ZXing.BrowserMultiFormatReader();
        await reader.decodeFromConstraints({ video: { facingMode: { ideal: 'environment' } } }, $('video', sc), (result) => { if (result && !finished) finish(result.getText()); });
        msg('把條碼放進框內，會自動讀取');
      } catch (err) {
        if (finished) return;
        msg(err && err.message === 'load' ? '掃描元件載入失敗，請確認網路後再試，或手動輸入。'
          : '無法直接開啟相機（可能未允許相機權限）。請改按「拍照辨識」或手動輸入。');
      }
    })();
  });
}

let dlCap; const dlReady = (async () => { try { dlCap = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dlCap = null; } })();
async function exportCSV(filename, headers, rows) {
  const cell = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const text = '\ufeff' + [headers, ...rows].map(r => r.map(cell).join(',')).join('\r\n');
  await dlReady;
  if (dlCap) { try { await dlCap.save({ filename, data: text }); toast('已匯出 ' + filename); } catch (e) { if (e && e.code !== 'declined') toast('這裡無法下載檔案'); } return; }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type:'text/csv' })); a.download = filename; a.click(); } catch (e) { toast('這裡無法下載檔案'); }
}

  return { used, outNet, boxes: sum(x.outT, 'boxes'), yield: used > 0 ? outNet / used * 100 : null, scrap: sum(x.scrapT, 'weight'), down: downMins(x.repairT),

function condCalc(F, d) {

  });
  const m = $('[name="machine"]', d)?.value.trim(), p = $('[name="part"]', d)?.value.trim(), id = d.dataset.editing;
  const prev = list(FD.coll).filter(x => x.id !== id && x.machine === m && x.part === p).sort((a, b) => (b.ts || 0) - (a.ts || 0))[0];
  const changed = prev ? items.filter(it => { const v = $(`[name="${it.k}"]`, d)?.value.trim(); return v !== '' && has(prev[it.k]) && String(prev[it.k]) !== '' && num(v) !== num(prev[it.k]); })

}

function splitLine(line, d) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) { const c = line[i];
    if (q) { if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === d) { out.push(cur); cur = ''; } else cur += c; }
  out.push(cur); return out.map(x => x.trim());
}
function parseText(t) {

  const d = lines.some(l => l.includes('\t')) ? '\t' : ',';
  return lines.map(l => splitLine(l, d));
}
function rowsToStaff(rows) {
  if (!rows.length) return [];
  const h = rows[0].map(x => String(x ?? '').trim());
  const find = (...ks) => h.findIndex(x => ks.some(k => x.includes(k)));
  let mp, body;
  if (find('姓名', '名字') >= 0) { mp = { name: find('姓名', '名字'), empNo: find('工號', '員工編號', '編號'), role: find('職稱', '職務', '職位'), team: find('股別', '班別', '組別'), shift: find('班制', '工時', '身分'), note: find('備註') }; body = rows.slice(1); }
  else { mp = { name: 0, empNo: 1, role: 2, team: 3, note: 4, shift: -1 }; body = rows; }   // 沒有標題列：依序視為 姓名、工號、職稱、股別、備註
  const g = (r, i) => i >= 0 ? String(r[i] ?? '').trim() : '';
  const seen = new Map();
  body.map(r => ({ name: g(r, mp.name), empNo: g(r, mp.empNo), role: g(r, mp.role), team: g(r, mp.team), shift: g(r, mp.shift), note: g(r, mp.note) }))
      .filter(p => p.name || p.empNo).forEach(p => seen.set(p.empNo || p.name, p));   // 同一份名單重複的只留最後一筆
  return [...seen.values()];
}

}

/* ===== 3. 訂單排程 ===== */
function orderOutput(o) {          // 訂單產出：舊條件記錄良品＋生產日報產能列（箱數，pcs 單位時乘入數）
  const res = { good: 0, dates: new Set() }; if (!o || !o.orderNo) return res;
  list('logs').forEach(x => { if (x.orderNo === o.orderNo) { res.good += num(x.good); if (x.date) res.dates.add(x.date); } });
  list('reports').forEach(rp => (rp.outT || []).forEach(r => { if (r.orderNo && String(r.orderNo).trim() === o.orderNo) {
    const b = num(r.boxes); res.good += (o.unit === 'pcs' && num(o.perBox) > 0) ? b * num(o.perBox) : b; if (rp.date) res.dates.add(rp.date); } }));
  return res;
}
function producedFor(o) { return orderOutput(o).good; }
function rateFor(o) {
  const L = list('logs').filter(x => num(x.cycle) > 0).sort((a, b) => (b.ts || 0) - (a.ts || 0));
  const hit = L.find(x => o.orderNo && x.orderNo === o.orderNo) || L.find(x => x.machine === o.machine && x.part === o.part) || L.find(x => o.part && x.part === o.part);
  return hit ? hourRate(hit.cycle, hit.cavity) : 0;
}

/* ---------- 交期預估引擎 ----------
   1. 日產量：優先用「實績」＝該訂單良品 ÷ 有生產記錄的天數；
      沒有實績時用「理論」＝3600 ÷ 週期 × 穴數 × 每日生產時數 × 稼動率。
   2. 同一台機台的未完成訂單依序排隊（生產中 → 預計開工 → 交期），前一張做完才輪到下一張。
   3. 預估完工日 vs 交期 → 準時／延遲幾天。                                         */
const CFG_DEF = { hours: 24, eff: 85, sundayOff: false };
const cfg = () => ({ ...CFG_DEF, ...(S.data.config.get('main') || {}) });
function orderActual(o) {
  const out = orderOutput(o), dates = [...out.dates].sort();
  return { good: out.good, days: dates.length, first: dates[0] || '', last: dates[dates.length - 1] || '',
           span: dates.length ? Math.round((parseD(dates[dates.length - 1]) - parseD(dates[0])) / 864e5) + 1 : 0 };
}
function dailyRate(o, act) {
  const c = cfg();
  if (act.days && act.good > 0) return { rate: act.good / act.days, src: '實績' };
  if (num(o.planRate) > 0) return { rate: num(o.planRate), src: '標準' };
  const hr = rateFor(o);
  if (hr) return { rate: hr * num(c.hours) * num(c.eff) / 100, src: '理論' };
  return { rate: 0, src: '無資料' };
}
function addWorkTime(start, days, sundayOff) {        // 往後推算 days 個「生產日」（可跳過週日）
  let t = new Date(start), left = days * 864e5;
  for (let guard = 0; left > 0 && guard < 4000; guard++) {
    const dayEnd = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1);
    if (sundayOff && t.getDay() === 0) { t = dayEnd; continue; }
    const avail = dayEnd - t;
    if (left <= avail) { t = new Date(+t + left); left = 0; } else { left -= avail; t = dayEnd; }
  }
  return t;
}
function estimateAll() {
  const c = cfg(), now = new Date(), res = {};
  const orders = list('orders');
  const byM = {};
  orders.forEach(o => {
    const act = orderActual(o), qty = num(o.qty), done = Math.max(producedFor(o), act.good), rem = Math.max(0, qty - done);
    const r = { act, qty, done, rem, ...dailyRate(o, act), needDays: 0, estStart: null, estEnd: null, late: 0, state: '' };
    res[o.id] = r;
    if (o.status === '完成') { r.state = 'done'; return; }
    if (o.status === '暫停') { r.state = 'paused'; return; }
    (byM[o.machine || '未指定'] = byM[o.machine || '未指定'] || []).push(o);
  });
  const pri = { 生產中: 0, 排定: 1, 待排: 2 };
  for (const m in byM) {
    let cursor = now;
    byM[m].sort((a, b) => (pri[a.status] ?? 3) - (pri[b.status] ?? 3) || String(a.start || '9999').localeCompare(String(b.start || '9999')) || String(a.due || '9999').localeCompare(String(b.due || '9999')))
      .forEach(o => {
        const r = res[o.id];
        if (r.rem <= 0) { r.state = 'ok'; r.estEnd = now; r.needDays = 0; }
        else if (!r.rate) { r.state = 'unknown'; return; }
        else {
          let st = cursor;
          if (o.start && o.status !== '生產中') { const ps = parseD(o.start); if (ps > st) st = ps; }
          r.estStart = st; r.needDays = r.rem / r.rate; r.estEnd = addWorkTime(st, r.needDays, c.sundayOff); cursor = r.estEnd;
        }
        if (o.due) {
          const dueEnd = addDays(parseD(o.due), 1);
          r.late = r.estEnd > dueEnd ? Math.ceil((r.estEnd - dueEnd) / 864e5) : 0;
          r.margin = r.estEnd <= dueEnd ? Math.floor((dueEnd - r.estEnd) / 864e5) : 0;
        }
        r.state = r.late > 0 ? 'late' : 'ok';
      });
  }
  return res;
}
const estTag = r => !r ? '' : r.state === 'late' ? `<span class="tag bad">預估延遲 ${r.late} 天</span>`
  : r.state === 'ok' && r.estEnd ? `<span class="tag ok">預估準時${r.margin != null && r.rem ? '（餘 ' + r.margin + ' 天）' : ''}</span>`
  : r.state === 'unknown' ? '<span class="tag">缺生產資料</span>' : r.state === 'paused' ? '<span class="tag">暫停中</span>' : '';
const dTxt = d => d ? `${d.getMonth() + 1}/${d.getDate()}（${WD[d.getDay()]}）${pad(d.getHours())}:00` : '—';
function editEstCfg() {
  const c = cfg();
  const sec = [{ title: '交期預估設定', fields: [['hours', '每日生產時數', 'num', 'h'], ['eff', '稼動率（理論值用）', 'num', '%'], ['sundayOff', '週日', 'select', ['照常生產', '停機']]] }];
  openSheet({
    title: '預估設定',
    body: formHTML(sec, { hours: c.hours, eff: c.eff, sundayOff: c.sundayOff ? '停機' : '照常生產' }) +
      `<p class="hint">有生產記錄的訂單，系統直接用「實際日產量」推算，不受稼動率影響；稼動率只用在還沒開工、只能用週期與穴數估算的訂單。三班或兩班 12 小時都是 24 小時。</p>`,
    onSave: async d => {
      const v = readForm(d, sec);
      if (!(num(v.hours) > 0 && num(v.hours) <= 24)) { toast('每日生產時數請填 1～24'); return false; }
      if (!(num(v.eff) > 0 && num(v.eff) <= 100)) { toast('稼動率請填 1～100'); return false; }
      await save('config', 'main', { hours: num(v.hours), eff: num(v.eff), sundayOff: v.sundayOff === '停機' });
      toast('已儲存預估設定');
    }
  });
}

/* ---------- 甘特圖（依預估完工推算的時間軸） ---------- */
const GZ = { '2週': { n:14, back:2, px:64 }, '4週': { n:28, back:3, px:42 }, '8週': { n:56, back:7, px:26 } };
function ganttHTML(orders, EST) {
  const z = GZ[UI.gz] || GZ['4週'], N = z.n;
  const from = addDays(parseD(today()), -z.back), to = addDays(from, N), span = to - from;
  const pos = t => (t - from) / span * 100;
  const clamp = v => Math.max(0, Math.min(100, v));
  const items = [];
  orders.forEach(o => {
    const r = EST[o.id] || { act:{} };
    let a = null, b = null, cls = 's-wait';
    if (o.status === '完成') { cls = 's-done'; a = r.act.first ? parseD(r.act.first) : o.start ? parseD(o.start) : null; b = r.act.last ? addDays(parseD(r.act.last), 1) : o.end ? addDays(parseD(o.end), 1) : null; }
    else if (o.status === '暫停') { cls = 's-pause'; a = o.start ? parseD(o.start) : null; b = o.end ? addDays(parseD(o.end), 1) : a ? addDays(a, 1) : null; }
    else {
      cls = o.status === '生產中' ? 's-run' : o.status === '排定' ? 's-plan' : 's-wait';
      a = r.act.first ? parseD(r.act.first) : r.estStart || (o.start ? parseD(o.start) : null);
      b = r.estEnd || (o.end ? addDays(parseD(o.end), 1) : null);
      if (a && b && b <= a) b = new Date(+a + 36e5 * 2);
    }
    if (!a || !b) return;
    if (b < from || a > to) return;
    const qy = num(o.qty), pct = qy ? Math.min(100, (r.done || 0) / qy * 100) : 0;
    items.push({ o, r, a, b, cls, pct, late: r.state === 'late', m: o.machine || '未指定',
      plan: o.start && o.end ? [parseD(o.start), addDays(parseD(o.end), 1)] : null, due: o.due ? addDays(parseD(o.due), 1) : null });
  });
  if (!items.length) return `<div class="panel glass"><div class="gx-tools"><h2><span class="bar"></span>生產甘特圖</h2>${gzChips()}</div><p class="hint" style="margin:0">這段期間沒有可顯示的訂單。訂單填上機台、數量，或預計開工／完工日後就會出現在甘特圖上。</p></div>`;
  const machines = uniq(items.map(x => x.m));
  const days = [...Array(N)].map((_, i) => addDays(from, i));
  const now = new Date(), nowP = pos(now);
  const weekend = days.map((d, i) => (d.getDay() === 0 || d.getDay() === 6) ? `<div class="gx-we" style="left:${i / N * 100}%;width:${100 / N}%"></div>` : '').join('');
  const lanes = machines.map(m => {
    const its = items.filter(x => x.m === m).sort((x, y) => x.a - y.a);
    const rowsEnd = [];                                  // 重疊時自動分行
    its.forEach(x => { let k = rowsEnd.findIndex(e => e <= x.a); if (k < 0) { k = rowsEnd.length; rowsEnd.push(0); } rowsEnd[k] = x.b; x.row = k; });
    const H = Math.max(1, rowsEnd.length) * 50 + 8;
    const bars = its.map(x => {
      const l = clamp(pos(x.a)), w = Math.max(0.6, clamp(pos(x.b)) - l), top = 10 + x.row * 50;
      const tip = `${x.o.orderNo}｜${x.o.part || ''}\n${x.o.status || '待排'}・${fmt(x.r.done || 0, 0)}／${fmt(num(x.o.qty), 0)}（${x.pct.toFixed(0)}%）\n${md(ymd(x.a))} → ${x.r.estEnd && x.o.status !== '完成' ? '預估 ' + dTxt(x.r.estEnd) : md(ymd(addDays(x.b, -1)))}${x.o.due ? '\n交期 ' + md(x.o.due) : ''}${x.late ? '\n⚠ 預估延遲 ' + x.r.late + ' 天' : ''}`;
      const plan = x.plan ? `<div class="gx-plan" style="left:${clamp(pos(x.plan[0]))}%;width:${Math.max(0, clamp(pos(x.plan[1])) - clamp(pos(x.plan[0])))}%;top:${top + 42}px"></div>` : '';
      const due = x.due && x.o.status !== '完成' && pos(x.due) >= 0 && pos(x.due) <= 100 ? `<div class="gx-due" style="left:${pos(x.due)}%;top:${top - 6}px;height:50px"><span>交 ${md(x.o.due)}</span></div>` : '';
      return `${plan}<button class="gx-bar ${x.cls} ${x.late ? 's-late' : ''}" data-id="${x.o.id}" title="${esc(tip)}" style="left:${l}%;width:${w}%;top:${top}px"><span class="fill" style="width:${x.pct}%"></span><span class="lb">${esc(x.o.orderNo)}${x.late ? ' ⚠' : ''}<small>${esc(x.o.part || x.o.customer || '')}${x.pct ? '・' + x.pct.toFixed(0) + '%' : ''}</small></span></button>${due}`;
    }).join('');
    return `<div class="gx-row"><div class="gx-name">${esc(m)}<small>${its.filter(x => x.o.status !== '完成').length} 張進行</small></div><div class="gx-track" style="height:${H}px">${weekend}${nowP >= 0 && nowP <= 100 ? `<div class="gx-now" style="left:${nowP}%"></div>` : ''}${bars}</div></div>`;
  }).join('');
  return `<div class="panel glass" style="margin-bottom:14px"><div class="gx-tools"><h2><span class="bar"></span>生產甘特圖</h2>${gzChips()}</div>
    <div class="gx-scroll"><div class="gx" style="--n:${N};--w:${96 + N * z.px}px">
      <div class="gx-row gx-head"><div class="gx-name">機台</div><div style="position:relative"><div class="gx-days">${days.map(d => `<div class="${d.getDay() === 0 || d.getDay() === 6 ? 'we' : ''} ${ymd(d) === today() ? 'td' : ''} ${d.getDate() === 1 ? 'm1' : ''}">${N > 30 ? '' : WD[d.getDay()]}<b>${N > 30 && d.getDate() !== 1 && d.getDay() !== 1 && ymd(d) !== today() ? d.getDate() : (d.getMonth() + 1) + '/' + d.getDate()}</b></div>`).join('')}</div>${nowP >= 0 && nowP <= 100 ? `<div class="gx-now" style="left:${nowP}%"></div>` : ''}</div></div>
      ${lanes}
    </div></div>
    <div class="gx-legend"><span><i style="background:linear-gradient(135deg,#FF9F0A,#FF375F)"></i>生產中</span><span><i style="background:linear-gradient(135deg,#40C8E0,#0A84FF)"></i>排定</span><span><i style="background:linear-gradient(135deg,#A1A1AA,#6E6E78)"></i>待排</span><span><i style="background:repeating-linear-gradient(135deg,#8E8E93 0 4px,#AEAEB2 4px 8px)"></i>暫停</span><span><i style="background:linear-gradient(135deg,#30D158,#1E9E5A)"></i>完成</span><span><i style="background:transparent;box-shadow:inset 0 0 0 2px var(--red)"></i>預估延遲</span><span><i style="background:transparent;border-left:2px dashed var(--red);border-radius:0;width:2px"></i>交期</span><span><i style="background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px);height:3px"></i>原計畫</span><span><i style="background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1px var(--line)"></i>色條內淺色＝已完成比例</span></div></div>`;
}
const gzChips = () => `<div class="chips">${Object.keys(GZ).map(k => `<button class="chip" data-gz="${k}" aria-pressed="${k === (UI.gz || '4週')}">${k}</button>`).join('')}</div>`;
const STATUS_TAG = { 待排:'', 排定:'blue', 生產中:'warn', 暫停:'', 完成:'ok' };
function viewSchedule() {
  const q = UI.q.schedule, td = today();
  const orders = list('orders');
  const stF = o => UI.ordStatus === '全部' || (UI.ordStatus === '未完成' ? o.status !== '完成' : o.status === UI.ordStatus);
  const shown = orders.filter(o => stF(o) && matchQ(o, q));
  const active = orders.filter(o => o.status !== '完成');
  const EST = estimateAll();
  const isRisk = o => o.status !== '完成' && ((EST[o.id] && EST[o.id].state === 'late') || (o.due && o.due < td && EST[o.id] && EST[o.id].rem > 0));
  const risk = active.filter(isRisk);
  const totQty = active.reduce((s, o) => s + num(o.qty), 0), totDone = active.reduce((s, o) => s + Math.min(num(o.qty), producedFor(o)), 0);

function orderCalc(d) {
  const g = k => $(`[name="${k}"]`, d)?.value;
  const o = { orderNo: g('orderNo'), machine: g('machine'), part: g('part') };
  const dn = producedFor(o), qy = num(g('qty')), hr = rateFor(o), rem = Math.max(0, qy - dn);
  const days = g('start') && g('end') ? Math.round((parseD(g('end')) - parseD(g('start'))) / 864e5) + 1 : 0;
  const act = orderActual(o), dr = dailyRate(o, act), c = cfg();
  const st = g('start') && parseD(g('start')) > new Date() ? parseD(g('start')) : new Date();
  const end = dr.rate && rem ? addWorkTime(st, rem / dr.rate, c.sundayOff) : null;
  const dueEnd = g('due') ? addDays(parseD(g('due')), 1) : null;
  $('#calc', d).innerHTML = `<h4>即時計算</h4>${formulaTable([
    ['已生產', '條件記錄良品加總', fmt(dn, 0) + ' pcs'],
    ['達成率', '已生產 ÷ 訂單數量', qy ? (dn / qy * 100).toFixed(1) + '%' : '—'],
    ['理論時產', '3600 ÷ 週期 × 穴數', hr ? fmt(hr, 0) + ' pcs/h' : '尚無條件記錄'],
    ['已生產天數', '有記錄的天數', act.days ? act.days + ' 天' : '—'],
    ['日產量', dr.src, dr.rate ? fmt(dr.rate, 0) + ' pcs/天' : '—'],
    ['還需天數', '剩餘 ÷ 日產量', end ? fmt(rem / dr.rate, 1) + ' 天' : '—'],
    ['預估完工', '單張估算（未含排隊）', end ? dTxt(end) + (dueEnd ? (end > dueEnd ? ` <span class="tag bad">延遲 ${Math.ceil((end - dueEnd) / 864e5)} 天</span>` : ' <span class="tag ok">準時</span>') : '') : '—'],
    ['排程天數', '完工日 − 開工日 + 1', days ? days + ' 天' : '—']])}`;
}

  if (dlCap) { try { await dlCap.save({ filename, data: text }); toast('已匯出 ' + filename); } catch (e) { if (e && e.code !== 'declined') toast('這裡無法下載檔案'); } return; }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = filename; a.click(); toast('已匯出 ' + filename); } catch (e) { toast('這裡無法下載檔案'); }
}

/* 通用 Excel／CSV 匯入：依標題列對應欄位 */
const normH = h => String(h || '').replace(/[（(].*?[）)]/g, '').replace(/[\s／/]/g, '').toLowerCase();
function normDate(v) {
  const m = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/.exec(String(v || '').trim());
  return m ? `${m[1]}-${pad(+m[2])}-${pad(+m[3])}` : String(v || '').trim();
}
async function readAnyFile(f) {
  if (/\.(xlsx|xls)$/i.test(f.name)) {
    await loadXLSX();
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array', cellDates: true });
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '', dateNF: 'yyyy-mm-dd' });
  }
  return parseText(await readFileText(f));
}
function mapRows(rows, fields) {     // fields: [{ key, labels:[...], type }]
  if (!rows.length) return { items: [], matched: 0 };
  const h = rows[0].map(normH);
  const idx = fields.map(fd => h.findIndex(x => x && fd.labels.some(l => normH(l) === x)));
  const matched = idx.filter(i => i >= 0).length;
  const items = rows.slice(1).map(r => {
    const o = {};
    fields.forEach((fd, j) => { if (idx[j] < 0) return; let val = String(r[idx[j]] ?? '').trim();
      if (fd.type === 'num') o[fd.key] = val === '' ? '' : num(val.replace(/,/g, '')); else if (fd.type === 'date') o[fd.key] = normDate(val); else o[fd.key] = val; });
    return o;
  }).filter(o => Object.values(o).some(x => x !== '' && x != null));
  return { items, matched };
}
function importDialog(cfg) {      // cfg: { title, hint, fields, keyOf, findExisting, label, cols, template, saveItem }
  let items = [];
  const preview = d => {
    const upd = $('#imupd', d).checked, box = $('#impv', d);
    if (!items.length) { box.innerHTML = '<p class="hint">選擇檔案或貼上資料後，這裡會顯示預覽。</p>'; $('#ok', d).textContent = '確認匯入'; return; }
    let nN = 0, nU = 0, nS = 0;
    const rowsH = items.slice(0, 200).map(it => { const bad = cfg.invalid && cfg.invalid(it); const ex = !bad && cfg.findExisting(it); let st;
      if (bad) { st = `<span class="tag bad">${esc(bad)}</span>`; nS++; } else if (ex) { if (upd) { st = '<span class="tag blue">更新</span>'; nU++; } else { st = '<span class="tag">已存在，略過</span>'; nS++; } } else { st = '<span class="tag ok">新增</span>'; nN++; }
      return `<tr>${cfg.cols.map(([k]) => `<td>${esc(it[k] ?? '')}</td>`).join('')}<td>${st}</td></tr>`; }).join('');
    box.innerHTML = `<p style="margin:12px 0 6px;font-weight:600">共 ${items.length} 筆：新增 ${nN}、更新 ${nU}、略過 ${nS}</p><div class="tbl-wrap" style="max-height:300px;overflow:auto;border:1px solid var(--line)"><table class="tbl"><thead><tr>${cfg.cols.map(c => `<th>${c[1]}</th>`).join('')}<th>處理</th></tr></thead><tbody>${rowsH}</tbody></table></div>`;
    $('#ok', d).textContent = `確認匯入 ${nN + nU} 筆`;
  };
  const parse = (rows, d) => { const r = mapRows(rows, cfg.fields); if (!r.matched) { items = []; toast('找不到可對應的欄位標題，請先下載範本對照'); } else items = r.items; preview(d); };
  openSheet({
    title: cfg.title,
    body: `<p class="hint" style="margin-top:0">${cfg.hint} 支援 Excel（.xlsx）或 CSV，第一列放欄位名稱（與匯出的檔案相同）。也可以從 Excel 複製後貼到下方。</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0"><label class="btn pri">選擇檔案<input type="file" id="imfile" accept=".xlsx,.xls,.csv,.txt" hidden></label><button type="button" class="btn" id="imtpl">下載範本</button></div>
      <textarea class="ctl" id="impaste" style="width:100%;height:auto;min-height:100px;padding:10px 12px;font-size:16px" placeholder="或在這裡貼上資料（含標題列）"></textarea>
      <label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:15px"><input type="checkbox" id="imupd" checked style="width:20px;height:20px">${cfg.label}相同時，更新原有資料</label><div id="impv"></div>`,
    onInput: d => { const t = $('#impaste', d).value; if (t.trim()) parse(parseText(t), d); else if (!d.dataset.file) { items = []; preview(d); } else preview(d); },
    onSave: async d => {
      const upd = $('#imupd', d).checked; let n = 0;
      for (const it of items) { if (cfg.invalid && cfg.invalid(it)) continue; const ex = cfg.findExisting(it); if (ex && !upd) continue; await cfg.saveItem(it, ex); n++; }
      if (!n) { toast('沒有可以匯入的資料'); return false; }
      toast(`已匯入 ${n} 筆`);
    }
  });
  delete dlg.dataset.file;
  $('#imtpl', dlg).onclick = () => exportCSV(cfg.template.name, cfg.template.headers, cfg.template.rows || []);
  $('#imfile', dlg).onchange = async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    try { const rows = await readAnyFile(f); dlg.dataset.file = '1'; $('#impaste', dlg).value = ''; parse(rows, dlg); }
    catch (err) { toast(err && err.message === 'load' ? '無法載入 Excel 讀取元件，請改用 CSV 或複製貼上' : '無法讀取這個檔案，請改用 Excel 或 CSV'); }
    e.target.value = '';
  };
}

function importFormRecords(F) {
  const FD = FORMS[F];
  const fs = FD.sections.flatMap(s => s.fields).filter(f => f[2] !== 'table');
  const fields = fs.map(f => ({ key: f[0], type: f[2] === 'spec' || f[2] === 'num' ? 'num' : f[2] === 'date' ? 'date' : 'text',
    labels: f[2] === 'spec' ? [f[3].l, f[0]] : [f[1], f[0]] }));
  const keyOf = it => F === 'sheet' ? [it.date, it.time, it.batch, it.rollNo].join('|') : [it.date, it.shift, it.machine, it.part].join('|');
  importDialog({
    title: `匯入${FD.name}`, hint: `資料會依「${F === 'sheet' ? '日期＋時間＋批次＋支號' : '日期＋班別＋機台＋產品編號'}」比對是否已存在。`,
    fields, label: '同一筆記錄', cols: (F === 'sheet' ? [['date','日期'],['time','時間'],['part','產品'],['batch','批次'],['rollNo','支號']] : [['date','日期'],['shift','班別'],['machine','機台'],['part','產品編號']]),
    invalid: it => !it.part ? '缺產品編號' : !/^\d{4}-\d{2}-\d{2}$/.test(it.date || '') ? '日期格式錯誤' : '',
    findExisting: it => list(FD.coll).find(x => keyOf(x) === keyOf(it)),
    template: { name: `${FD.name}_匯入範本.csv`, headers: fs.map(f => f[2] === 'spec' ? f[3].l + (f[3].u ? `(${f[3].u})` : '') : f[1]) },
    saveItem: async (it, ex) => save(FD.coll, ex ? ex.id : uid(), { ...(ex ? (({ id, ...r }) => r)(ex) : {}), ...it, ts: ex ? (ex.ts || Date.now()) : Date.now(), updated: Date.now() })
  });
}
